<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Background with a premium gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6bac" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="gridGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Rounded Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- 2x2 Grid Squares -->
  <!-- Top-Left Square -->
  <rect x="106" y="106" width="140" height="140" rx="24" fill="url(#gridGrad)" filter="url(#shadow)" />
  <!-- Top-Right Square -->
  <rect x="266" y="106" width="140" height="140" rx="24" fill="url(#gridGrad)" filter="url(#shadow)" opacity="0.9" />
  <!-- Bottom-Left Square -->
  <rect x="106" y="266" width="140" height="140" rx="24" fill="url(#gridGrad)" filter="url(#shadow)" opacity="0.9" />
  <!-- Bottom-Right Square -->
  <rect x="266" y="266" width="140" height="140" rx="24" fill="url(#gridGrad)" filter="url(#shadow)" />

  <!-- Top-Left Pie Chart inside Top-Left Square -->
  <g transform="translate(176, 176)">
    <!-- Soft shadow background for pie chart -->
    <circle cx="0" cy="0" r="48" fill="#fbcfe8" opacity="0.4" />
    
    <!-- 3/4 slice (pink) -->
    <path d="M 0 0 L 42 0 A 42 42 0 1 1 0 -42 Z" fill="#db2777" />
    
    <!-- 1/4 slice (yellow, popped out) -->
    <path d="M 5 -5 L 5 -47 A 42 42 0 0 1 47 -5 Z" fill="#fbbf24" />
  </g>

  <!-- Bottom-Right Pie Chart inside Bottom-Right Square -->
  <g transform="translate(336, 336)">
    <!-- Soft shadow background for pie chart -->
    <circle cx="0" cy="0" r="48" fill="#fbcfe8" opacity="0.4" />
    
    <!-- 3/4 slice (pink) -->
    <path d="M 0 0 L 42 0 A 42 42 0 1 1 0 -42 Z" fill="#db2777" />
    
    <!-- 1/4 slice (yellow, popped out) -->
    <path d="M 5 -5 L 5 -47 A 42 42 0 0 1 47 -5 Z" fill="#fbbf24" />
  </g>

  <!-- Subtle placeholder dots for the empty cells (Top-Right and Bottom-Left) -->
  <circle cx="336" cy="176" r="8" fill="#a855f7" opacity="0.3" />
  <circle cx="176" cy="336" r="8" fill="#a855f7" opacity="0.3" />
</svg>
