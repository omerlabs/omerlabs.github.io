name: Update SP 500 Data

on:
  schedule:
    # Runs 5 times daily (Monday to Friday) — TSI times in comments
    - cron: '45 13 * * 1-5'  # 16:45 TSİ — Borsa açılışı
    - cron: '30 14 * * 1-5'  # 17:30 TSİ — Açılış sonrası
    - cron: '30 16 * * 1-5'  # 19:30 TSİ — Gün ortası
    - cron: '0 18 * * 1-5'   # 21:00 TSİ — Kapanış öncesi
    - cron: '0 21 * * 1-5'   # 00:00 TSİ — Kapanış sonrası
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Required to push the updated JSON back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

    steps:
      - name: Checkout repository
        # Note: this checkout will pull the source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'SP500-market-cap/scripts/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r SP500-market-cap/scripts/requirements.txt

      - name: Run data update script
        run: python SP500-market-cap/scripts/update_data.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add SP500-market-cap/data/*.json
          # Commit only if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update market indexes financial data [skip ci]"
            git push origin main
          else
            echo "No changes in index data, skipping commit."
          fi
