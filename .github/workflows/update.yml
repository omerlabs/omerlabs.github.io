name: Update SP 500 Data

on:
  schedule:
    # Runs 3 times daily (Monday to Friday)
    - cron: '30 14 * * 1-5'
    - cron: '0 18 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Required to push the updated JSON back to the repo

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        # Note: this checkout will pull the source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance beautifulsoup4 requests lxml pandas

      - name: Run data update script
        run: python SP500-market-cap/scripts/update_data.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add SP500-market-cap/data/*.json
          # Commit only if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update market indexes financial data [skip ci]"
            git push origin main
          else
            echo "No changes in index data, skipping commit."
          fi
