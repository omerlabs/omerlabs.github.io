name: Update Financial Data (Quarterly)

on:
  schedule:
    # 15 Şubat, 15 Mayıs, 15 Ağustos, 15 Kasım — 00:00 UTC (03:00 Türkiye TSİ)
    - cron: '0 0 15 2,5,8,11 *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  update-financials:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance requests beautifulsoup4 pandas lxml

      - name: Run financial data update
        run: python SP500-market-cap/scripts/update_financials.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SP500-market-cap/data/
          git diff --staged --quiet || git commit -m "data: quarterly financials update ($(date -u '+%Y-%m-%d'))"
          git push
