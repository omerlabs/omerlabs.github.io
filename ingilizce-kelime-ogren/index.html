<!DOCTYPE html>
<html lang="tr" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="6 yaş çocuklar için eğlenceli İngilizce kelime öğrenme oyunu. Dinle, seç, öğren!">
<meta name="theme-color" content="#3b82f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="WORDS">
<title>WORDS 🔊</title>
<link rel="manifest" href="manifest.json?v=7.0">
<link rel="apple-touch-icon" href="icon-192.png?v=7.0">
<link rel="icon" type="image/png" href="icon-192.png?v=7.0">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════
   PREMIUM DESIGN SYSTEM — TOKENS
═══════════════════════════════════════ */
:root {
  --bg: #f1f5f9;
  --card: rgba(255, 255, 255, 0.85);
  --card-solid: #ffffff;
  --blue: #4f46e5;
  --sky: #0ea5e9;
  --green: #10b981;
  --red: #f43f5e;
  --yellow: #f59e0b;
  --purple: #8b5cf6;
  --orange: #f97316;
  --text: #0f172a;
  --text-light: #ffffff;
  --muted: #64748b;
  --border: rgba(226, 232, 240, 0.8);
  --soft: #f8fafc;
  
  --bg-gradient1: rgba(99, 102, 241, 0.08);
  --bg-gradient2: rgba(168, 85, 247, 0.08);
  --bg-gradient3: rgba(16, 185, 129, 0.04);
  --cloud-opacity: 0.15;
  --overlay-bg: rgba(15, 23, 42, 0.4);
  --win-bg: rgba(241, 245, 249, 0.95);
  --fw-trail: rgba(241, 245, 249, 0.15);
  --shadow-premium: 0 20px 40px -15px rgba(79, 70, 229, 0.12), 0 0 0 1px rgba(79, 70, 229, 0.04);
  --card-blur: blur(20px);
}

[data-theme="dark"] {
  --bg: #090d16;
  --card: rgba(15, 23, 42, 0.65);
  --card-solid: #0f172a;
  --text: #f8fafc;
  --muted: #94a3b8;
  --border: rgba(51, 65, 85, 0.5);
  --soft: rgba(30, 41, 59, 0.5);
  
  --bg-gradient1: rgba(99, 102, 241, 0.15);
  --bg-gradient2: rgba(139, 92, 246, 0.12);
  --bg-gradient3: rgba(16, 185, 129, 0.06);
  --cloud-opacity: 0.06;
  --overlay-bg: rgba(2, 6, 23, 0.7);
  --win-bg: rgba(9, 13, 22, 0.96);
  --fw-trail: rgba(9, 13, 22, 0.18);
  --shadow-premium: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.06);
  --card-blur: blur(25px);
}

* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

body {
  font-family: 'Outfit', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  padding: 24px 16px 80px;
  overflow-x: hidden;
  transition: background 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  background-image:
    radial-gradient(ellipse at 5% 10%, var(--bg-gradient1) 0%, transparent 45%),
    radial-gradient(ellipse at 95% 90%, var(--bg-gradient2) 0%, transparent 45%),
    radial-gradient(ellipse at 50% 50%, var(--bg-gradient3) 0%, transparent 60%);
}

/* ── CLOUDS ── */
.cloud { position:fixed; opacity:var(--cloud-opacity); pointer-events:none; font-size:4rem; animation:cloudDrift var(--d,20s) linear infinite var(--dl,0s); z-index:0; }
@keyframes cloudDrift { from{transform:translateX(-120px)} to{transform:translateX(110vw)} }

/* ── THEME TOGGLE ── */
.theme-toggle {
  position:fixed; top:18px; right:18px; z-index:300;
  width:44px; height:44px; border-radius:14px;
  background: var(--card); border:1px solid var(--border);
  backdrop-filter: var(--card-blur);
  box-shadow: var(--shadow-premium);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  font-size:1.3rem; transition:transform 0.2s cubic-bezier(0.3, 1.5, 0.5, 1), background 0.3s, border-color 0.3s;
}
.theme-toggle:hover { transform: scale(1.08) rotate(15deg); }
.theme-toggle:active { transform: scale(0.92); }

/* ── HEADER ── */
.header { position:relative; z-index:1; text-align:center; margin-bottom:20px; }
.title {
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: clamp(2.2rem, 8vw, 3.4rem);
  color: var(--text);
  letter-spacing: -0.5px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
}
.title span {
  background: linear-gradient(135deg, var(--blue), var(--purple));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.subtitle { font-size: 0.95rem; color: var(--muted); font-weight: 500; margin-top: 6px; letter-spacing: 0.2px; }

/* ── STARS & SCORE ── */
.top-bar {
  position:relative; z-index:1;
  display:flex; gap:10px; align-items:center; justify-content:center;
  margin-bottom:18px; flex-wrap:wrap;
}
.stars-display {
  display:flex; gap:5px; align-items:center;
  background: var(--card); border-radius:16px; padding:8px 16px;
  border: 1px solid var(--border);
  backdrop-filter: var(--card-blur);
  box-shadow: var(--shadow-premium);
  transition: background 0.3s, border-color 0.3s;
}
.star-icon { font-size:1.2rem; transition:transform .3s; color: var(--muted); }
.star-icon.lit { color: var(--yellow); animation:starPop .4s cubic-bezier(.3,1.6,.5,1); }
@keyframes starPop { 0%{transform:scale(1)} 50%{transform:scale(1.4) rotate(15deg)} 100%{transform:scale(1)} }

.score-pill {
  background: var(--card); border-radius:16px; padding:8px 16px;
  border: 1px solid var(--border);
  backdrop-filter: var(--card-blur);
  box-shadow: var(--shadow-premium);
  font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--blue);
  display:flex; align-items:center; gap:6px;
  transition: background 0.3s, border-color 0.3s;
}

.streak-pill {
  background: var(--card); border-radius:16px; padding:8px 16px;
  border: 1px solid var(--border);
  backdrop-filter: var(--card-blur);
  box-shadow: var(--shadow-premium);
  font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.95rem; color: var(--orange);
  display:flex; align-items:center; gap:6px;
  transition: background 0.3s, border-color 0.3s, transform 0.3s;
}
.streak-pill.active {
  border-color: var(--orange);
  animation: streakGlow 1.2s ease-in-out infinite alternate;
}
@keyframes streakGlow {
  from { box-shadow: 0 0 10px rgba(249, 115, 22, 0.1); }
  to   { box-shadow: 0 0 20px rgba(249, 115, 22, 0.3); }
}
.streak-fire { display:inline-block; transition:transform .3s; }
.streak-pill.active .streak-fire { animation:fireWiggle .5s ease infinite; }
@keyframes fireWiggle { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-10deg) scale(1.15)} 75%{transform:rotate(10deg) scale(1.15)} }

.cat-pill {
  border-radius:16px; padding:8px 16px;
  font-size: 0.82rem; font-weight: 700; color: white; letter-spacing: 0.5px;
  box-shadow: 0 10px 20px -10px rgba(0,0,0,0.15);
}

/* ── BACK BUTTON ── */
.back-btn {
  position:relative; z-index:2;
  background: var(--card); border: 1px solid var(--border);
  backdrop-filter: var(--card-blur);
  border-radius:14px; padding:10px 20px;
  font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.9rem;
  color: var(--text); cursor:pointer;
  display:flex; align-items:center; gap:6px;
  box-shadow: var(--shadow-premium);
  transition: transform 0.2s, background 0.3s, border-color 0.3s;
  margin-bottom: 12px;
}
.back-btn:hover { transform: translateY(-2px); background: var(--soft); }
.back-btn:active { transform: scale(0.96); }

/* ── PROGRESS BAR ── */
.prog-wrap {
  position:relative; z-index:1;
  width:100%; max-width:500px;
  background: rgba(255,255,255,0.4); border-radius:20px; height:10px;
  margin-bottom:20px; overflow:hidden;
  border: 1px solid var(--border);
}
[data-theme="dark"] .prog-wrap { background: rgba(255,255,255,0.05); }
.prog-fill {
  height:100%; border-radius:18px;
  background: linear-gradient(90deg, var(--blue), var(--purple));
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  position:relative; overflow:hidden;
}

/* ── MAIN CARD ── */
.main-card {
  position:relative; z-index:1;
  background: var(--card); border-radius:32px;
  backdrop-filter: var(--card-blur);
  padding: 32px 24px 28px;
  max-width:500px; width:100%;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-premium);
  transition: background 0.3s, border-color 0.3s;
}

/* ── SOUND BUTTON ── */
.sound-section {
  display:flex; flex-direction:column; align-items:center; gap:14px;
  margin-bottom:24px;
}
.sound-timer-wrap {
  position:relative; width:140px; height:140px;
  display:flex; align-items:center; justify-content:center;
}
.timer-svg {
  position:absolute; inset:0; width:140px; height:140px;
  transform:rotate(-90deg);
}
.timer-track { fill:none; stroke: var(--border); stroke-width:4; transition:stroke .3s; }
.timer-progress {
  fill:none; stroke: var(--blue); stroke-width:4;
  stroke-linecap:round;
  transition:stroke .4s, stroke-dashoffset .1s linear;
}
.timer-progress.warn  { stroke: var(--orange); }
.timer-progress.danger { stroke: var(--red); }

.sound-btn {
  width:110px; height:110px; border-radius:50%;
  background: linear-gradient(135deg, var(--blue), var(--sky));
  border:none; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
  box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3);
  transition: transform 0.2s cubic-bezier(0.3, 1.5, 0.5, 1), box-shadow 0.2s;
  animation: pulseIdle 3s ease-in-out infinite;
  position:relative; overflow:hidden; z-index:1;
}
.sound-btn::before {
  content:''; position:absolute; inset:0; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, rgba(255,255,255,.25), transparent 60%);
}
.sound-btn:hover  { transform:scale(1.05); box-shadow: 0 14px 40px rgba(79, 70, 229, 0.4); }
.sound-btn:active { transform:scale(.95); }
.sound-btn.speaking { animation:speakingPulse .6s ease-in-out infinite; }
@keyframes pulseIdle {
  0%,100%{ box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3), 0 0 0 0 rgba(79, 70, 229, 0.2); }
  50%    { box-shadow: 0 10px 30px rgba(79, 70, 229, 0.3), 0 0 0 16px rgba(79, 70, 229, 0); }
}
@keyframes speakingPulse {
  0%,100%{ transform:scale(1); box-shadow: 0 10px 30px rgba(79, 70, 229, 0.4); }
  50%    { transform:scale(1.05); box-shadow: 0 12px 35px rgba(79, 70, 229, 0.5), 0 0 0 20px rgba(79, 70, 229, 0); }
}
.sound-icon  { font-size:2.8rem; line-height:1; }
.sound-label { font-size:.7rem; font-weight:800; color:white; opacity:.9; letter-spacing:1px; text-transform:uppercase; }

/* ── ENGLISH WORD DISPLAY ── */
.word-display {
  font-family: 'Fredoka', sans-serif;
  font-size: clamp(1.8rem, 6vw, 2.6rem);
  color: var(--blue);
  text-align:center;
  letter-spacing: 0.5px;
  text-transform:uppercase;
  min-height: 2.8rem;
  font-weight: 700;
  animation: wordFadeIn .4s cubic-bezier(0.16, 1, 0.3, 1);
}
@keyframes wordFadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }

.listen-again {
  font-size: 0.85rem; font-weight: 700; color: var(--muted);
  cursor:pointer; display:flex; align-items:center; gap:6px;
  background: var(--soft); border-radius:14px; padding:6px 16px;
  border: 1px solid var(--border); transition: all 0.2s;
}
.listen-again:hover { background: var(--border); color: var(--blue); }

/* ── SPEED BONUS INDICATOR ── */
.speed-bonus {
  position:absolute; top:-12px; right:-12px;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  color:white; font-family: 'Outfit', sans-serif; font-weight: 800;
  font-size:.72rem; padding:5px 12px; border-radius:12px;
  opacity:0; transform:scale(0); transition:all .3s cubic-bezier(.3,1.6,.5,1);
  pointer-events:none; white-space:nowrap;
  box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
}
.speed-bonus.show { opacity:1; transform:scale(1); }

/* ── CHOICES ── */
.choices-label { font-size: 0.8rem; font-weight: 800; color: var(--muted); text-transform:uppercase; letter-spacing:1px; text-align:center; margin-bottom:16px; }
.choices-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.choice-btn {
  aspect-ratio:1;
  background: var(--soft); border-radius:24px;
  border: 2px solid var(--border);
  cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:8px; transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, box-shadow 0.2s, background 0.3s;
  padding:12px 8px;
  position:relative; overflow:hidden;
}
.choice-btn::before {
  content:''; position:absolute; inset:0; border-radius:22px;
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.5), transparent 60%);
  pointer-events:none;
}
[data-theme="dark"] .choice-btn::before {
  background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.05), transparent 60%);
}
.choice-btn:hover {
  transform: translateY(-6px);
  border-color: var(--blue);
  box-shadow: 0 12px 24px rgba(79, 70, 229, 0.15);
}
.choice-btn:active { transform: scale(0.95); }
.choice-emoji { font-size: clamp(3rem, 10vw, 4.2rem); line-height:1; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.1)); transition:transform .3s; }
.choice-btn:hover .choice-emoji { transform: scale(1.08) rotate(-4deg); }
.choice-tr { font-size: 0.8rem; font-weight: 800; color: var(--muted); text-align:center; line-height:1.2; }

/* Result states */
.choice-btn.correct {
  border-color: var(--green)!important;
  background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(16, 185, 129, 0.05))!important;
  box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.2)!important;
  animation: correctBounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
.choice-btn.wrong {
  border-color: var(--red)!important;
  background: linear-gradient(135deg, rgba(244, 63, 94, 0.15), rgba(244, 63, 94, 0.05))!important;
  animation: wrongWiggle 0.4s ease-in-out;
}
.choice-btn.dimmed { opacity:.3; pointer-events:none; }

@keyframes correctBounce { 0%{transform:scale(1)} 45%{transform:scale(1.1) rotate(2deg)} 100%{transform:scale(1)} }
@keyframes wrongWiggle   { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

/* ── FEEDBACK OVERLAY ── */
.fb-overlay {
  position:fixed; inset:0; z-index:100;
  display:none; align-items:center; justify-content:center;
  background: var(--overlay-bg); backdrop-filter: blur(8px);
}
.fb-overlay.show { display:flex; animation:fadeIn .3s ease; }

.fb-box {
  background: var(--card-solid); border-radius:32px; padding:32px;
  text-align:center; max-width:360px; width:92%;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-premium);
  animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  transition: background .3s, border-color .3s;
}
@keyframes popIn { from{transform:scale(.8);opacity:0} to{transform:scale(1);opacity:1} }

.fb-big-emoji { font-size:4.8rem; display:block; margin-bottom:8px; animation:bigPop .5s cubic-bezier(.3,1.6,.5,1); }
@keyframes bigPop { from{transform:scale(.3) rotate(-20deg)} to{transform:scale(1) rotate(0)} }

.fb-word-en { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 2.2rem; color: var(--blue); margin-bottom: 4px; }
.fb-word-tr { font-size: 1.05rem; font-weight: 700; color: var(--muted); margin-bottom: 16px; }
.fb-title   { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 1.6rem; margin-bottom: 6px; }
.fb-title.ok  { color: var(--green); }
.fb-title.bad { color: var(--red); }
.fb-pts { font-size: 0.9rem; font-weight: 700; color: var(--muted); margin-bottom: 16px; }

.fb-streak-bonus {
  display:none; margin-bottom:12px;
  font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 1.05rem;
  color: var(--orange);
  animation: streakBonusPop .4s cubic-bezier(.3,1.6,.5,1);
}

.fb-next-btn {
  font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1.05rem;
  padding:14px 32px; border:none; border-radius:18px; cursor:pointer;
  background: linear-gradient(135deg, var(--blue), var(--purple)); color:white;
  box-shadow: 0 8px 24px rgba(79, 70, 229, 0.25); transition: transform 0.2s, box-shadow 0.2s;
  width:100%;
}
.fb-next-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(79, 70, 229, 0.35); }

/* ── CATEGORY SCREEN ── */
.cat-screen {
  position:relative; z-index:1;
  background: var(--card); border-radius:32px; padding: 32px 24px;
  backdrop-filter: var(--card-blur);
  max-width:500px; width:100%;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-premium);
  text-align:center;
  transition: background .3s, border-color .3s;
}
.cat-title { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 1.8rem; color: var(--blue); margin-bottom: 4px; }
.cat-sub   { font-size: 0.95rem; font-weight: 500; color: var(--muted); margin-bottom: 24px; }
.cat-grid  { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-bottom:20px; max-height:50vh; overflow-y:auto; padding:4px; }
.cat-grid::-webkit-scrollbar { width:6px; }
.cat-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius:6px; }

.cat-item  {
  background: var(--soft); border: 2px solid var(--border);
  border-radius:24px; padding: 18px 10px; cursor:pointer;
  transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.2s, box-shadow 0.2s, background 0.3s;
  display:flex; flex-direction:column; align-items:center; gap:6px;
  position:relative;
}
.cat-item:hover {
  transform: translateY(-6px);
  border-color: var(--blue);
  box-shadow: 0 12px 24px rgba(79, 70, 229, 0.12);
  background: var(--card-solid);
}
.cat-item-emoji { font-size: 2.4rem; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.06)); }
.cat-item-name  { font-size: 0.88rem; font-weight: 800; color: var(--text); }
.cat-item-count { font-size: 0.72rem; font-weight: 600; color: var(--muted); }

/* ── BEST SCORE BADGE ── */
.best-badge {
  position:absolute; top:-8px; right:-8px;
  background: linear-gradient(135deg, var(--yellow), var(--orange));
  color:white; font-family: 'Fredoka', sans-serif; font-weight: 700;
  font-size:.65rem; padding:3px 9px; border-radius:10px;
  box-shadow: 0 4px 10px rgba(249, 115, 22, 0.25);
  display:none;
}

.random-btn {
  width:100%; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1rem;
  padding:14px; border:none; border-radius:18px; cursor:pointer;
  background: linear-gradient(135deg, var(--orange), var(--yellow)); color:white;
  box-shadow: 0 6px 20px rgba(249, 115, 22, 0.25); transition: transform 0.2s, box-shadow 0.2s;
}
.random-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(249, 115, 22, 0.35); }

/* ── WIN SCREEN ── */
.win-screen {
  position:fixed; inset:0; z-index:200;
  display:none; align-items:center; justify-content:center;
  background: var(--win-bg); backdrop-filter: blur(16px);
}
.win-screen.show { display:flex; animation:fadeIn .5s ease; }
.win-box {
  background: var(--card-solid); border-radius:32px; padding: 40px;
  text-align:center; max-width:400px; width:92%;
  border: 1px solid var(--border);
  box-shadow: var(--shadow-premium);
  animation: popIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  transition: background .3s, border-color .3s;
}
.win-title-words {
  font-family: 'Fredoka', sans-serif;
  font-weight: 700;
  font-size: clamp(2.8rem, 10vw, 4.2rem);
  background: linear-gradient(135deg, var(--blue), var(--purple), var(--orange));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  line-height:1; margin-bottom:12px;
}
.win-sub  { font-size: 1.05rem; font-weight: 600; color: var(--muted); margin-bottom: 16px; }
.win-learned { font-size: 0.9rem; font-weight: 700; color: var(--blue); margin-bottom: 20px; word-break:break-word; }
.win-stats { display:flex; gap:16px; justify-content:center; margin-bottom:24px; flex-wrap:wrap; }
.wstat   { display:flex; flex-direction:column; align-items:center; }
.wstat-v { font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 2.2rem; color: var(--blue); line-height:1; }
.wstat-l { font-size: 0.65rem; font-weight: 800; color: var(--muted); text-transform:uppercase; letter-spacing:0.5px; }
.win-btns { display:flex; flex-direction:column; gap:10px; }
.again-btn {
  font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1rem;
  padding:14px 28px; border:none; border-radius:16px; cursor:pointer;
  background: linear-gradient(135deg, var(--blue), var(--purple)); color:white;
  box-shadow: 0 6px 20px rgba(79, 70, 229, 0.25); transition: transform 0.2s;
}
.again-btn:hover { transform: translateY(-2px); }
.menu-btn {
  background: var(--soft); border: 1.5px solid var(--border); color: var(--text);
  font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 0.95rem;
  padding:11px; border-radius:16px; cursor:pointer; transition: all 0.2s;
}
.menu-btn:hover { background: var(--border); }

/* ── CONFETTI CANVAS ── */
#confettiCanvas {
  position:fixed; inset:0; pointer-events:none; z-index:99;
}
#fw { position:fixed; inset:0; pointer-events:none; z-index:199; }

/* ── INSTALL BUTTON ── */
.install-wrap {
  margin-top:14px; display:none;
}
.install-wrap.show { display:block; }
.install-btn {
  width:100%; font-family: 'Outfit', sans-serif; font-weight: 800; font-size: 1rem;
  padding:14px; border:none; border-radius:18px; cursor:pointer;
  background: linear-gradient(135deg, var(--blue), var(--sky)); color:white;
  box-shadow: 0 6px 20px rgba(79, 70, 229, 0.25);
  transition: transform 0.2s, box-shadow 0.2s;
  display:flex; align-items:center; justify-content:center; gap:8px;
  position:relative; overflow:hidden;
}
.install-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(79, 70, 229, 0.35); }
.install-btn:active { transform: scale(.98); }
.install-btn::after {
  content:''; position:absolute; top:0; left:-100%; width:60%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);
  animation:installShimmer 3s ease-in-out infinite;
}
@keyframes installShimmer { 0%{left:-100%} 50%{left:150%} 100%{left:150%} }
.install-badge {
  font-size:.65rem; background:rgba(255,255,255,.2); padding:2px 8px;
  border-radius:8px; letter-spacing:.3px;
}

/* ── RESPONSIVE ── */
@media(max-width:380px){
  .choice-emoji{font-size:2.6rem;}
  .choices-grid{gap:10px;}
  .main-card{padding:24px 16px 20px;}
  .top-bar{gap:6px;}
  .score-pill,.streak-pill,.stars-display{padding:6px 12px; font-size:.85rem;}
}
@media(min-width:600px){
  .cat-grid { grid-template-columns:repeat(3,1fr); }
}
@media(min-width:800px){
  .cat-grid { grid-template-columns:repeat(4,1fr); }
}

/* ══════════════════════════════════════════════
   STORAGE — localStorage
══════════════════════════════════════════════ */
const STORAGE_KEY = 'ada_english_v2';

function loadSave() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
  } catch { return {}; }
}

function writeSave(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch {}
}

function getBestScore(catKey) {
  const s = loadSave();
  return s.bestScores?.[catKey] || 0;
}

function saveBestScore(catKey, score) {
  const s = loadSave();
  if (!s.bestScores) s.bestScores = {};
  if (score > (s.bestScores[catKey] || 0)) {
    s.bestScores[catKey] = score;
  }
  writeSave(s);
}

function saveTheme(theme) {
  const s = loadSave();
  s.theme = theme;
  writeSave(s);
}

function loadTheme() {
  const s = loadSave();
  return s.theme || 'light';
}

/* ══════════════════════════════════════════════
   DARK MODE
══════════════════════════════════════════════ */
function toggleTheme() {
  const html = document.documentElement;
  const next = html.dataset.theme === 'dark' ? 'light' : 'dark';
  html.dataset.theme = next;
  document.getElementById('themeToggle').textContent = next === 'dark' ? '☀️' : '🌙';
  document.querySelector('meta[name="theme-color"]').content = next === 'dark' ? '#0f172a' : '#3b82f6';
  saveTheme(next);
}

function applyTheme() {
  const theme = loadTheme();
  document.documentElement.dataset.theme = theme;
  document.getElementById('themeToggle').textContent = theme === 'dark' ? '☀️' : '🌙';
  document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0f172a' : '#3b82f6';
}

/* ══════════════════════════════════════════════
   SPEECH
══════════════════════════════════════════════ */
let synth = window.speechSynthesis;
let currentWord = null;
let voices = [];

function loadVoices() { voices = synth.getVoices(); }
loadVoices();
if (speechSynthesis.onvoiceschanged !== undefined) {
  speechSynthesis.onvoiceschanged = loadVoices;
}

function getBestEnglishVoice() {
  const enUS = voices.filter(v => v.lang.startsWith('en-US'));
  const enAny = voices.filter(v => v.lang.startsWith('en'));
  const female = [...enUS, ...enAny].find(v => /female|zira|samantha|karen|moira|kate|victoria|fiona/i.test(v.name));
  return female || enUS[0] || enAny[0] || null;
}

function speakWord(word) {
  if (!word) word = currentWord?.en;
  if (!word) return;
  synth.cancel();
  const utt = new SpeechSynthesisUtterance(word);
  utt.lang = 'en-US';
  utt.rate = 0.78;
  utt.pitch = 1.1;
  utt.volume = 1;
  const voice = getBestEnglishVoice();
  if (voice) utt.voice = voice;
  const btn = document.getElementById('soundBtn');
  if (btn) {
    btn.classList.add('speaking');
    utt.onend = () => btn.classList.remove('speaking');
    utt.onerror = () => btn.classList.remove('speaking');
  }
  synth.speak(utt);
}

const TIMER_DURATION = 10; // seconds
const TIMER_CIRCUMFERENCE = 2 * Math.PI * 60; // r=60

function shuffle(a) {
  const b = [...a];
  for (let i = b.length - 1; i > 0; i--) {
    const j = 0 | Math.random() * (i + 1);
    [b[i], b[j]] = [b[j], b[i]];
  }
  return b;
}

/* ══════════════════════════════════════════════
   CATEGORY SCREEN
══════════════════════════════════════════════ */
function buildCatScreen() {
  const grid = document.getElementById('catGrid');
  grid.innerHTML = '';
  Object.entries(CATEGORIES).forEach(([key, cat]) => {
    const d = document.createElement('div');
    d.className = 'cat-item';
    const best = getBestScore(key);
    d.innerHTML = `
      <span class="best-badge ${best > 0 ? 'show' : ''}" id="best_${key}">🏆 ${best}</span>
      <span class="cat-item-emoji">${cat.emoji}</span>
      <span class="cat-item-name">${cat.name}</span>
      <span class="cat-item-count">${cat.words.length} kelime</span>`;
    d.onclick = () => startCategory(key);
    grid.appendChild(d);
  });
}

function startCategory(key) {
  currentCatKey = key;
  const cat = CATEGORIES[key];
  currentCatInfo = cat;
  gameWords = shuffle([...cat.words]).slice(0, Math.min(10, cat.words.length));
  launchGame(cat);
}

function startRandom() {
  currentCatKey = 'random';
  const all = Object.values(CATEGORIES).flatMap(c => c.words);
  gameWords = shuffle(all).slice(0, 15);
  currentCatInfo = { name:'Karışık', emoji:'🎲', color:'linear-gradient(135deg,#f97316,#fbbf24)' };
  launchGame(currentCatInfo);
}

function launchGame(catInfo) {
  gameIdx = 0; score = 0; stars = 0; correctCount = 0;
  streak = 0; bestStreak = 0; wrongWords = []; isRetryRound = false;
  updateStars(0);
  updateStreak(0);
  document.getElementById('scoreVal').textContent = 0;

  const pill = document.getElementById('catPill');
  pill.textContent = catInfo.emoji + ' ' + catInfo.name;
  pill.style.background = catInfo.color;

  document.getElementById('catScreen').style.display = 'none';
  const gs = document.getElementById('gameScreen');
  gs.style.display = 'flex';

  loadWord();
}

/* ══════════════════════════════════════════════
   TIMER
══════════════════════════════════════════════ */
function startTimer() {
  stopTimer();
  timerStartTime = Date.now();
  const prog = document.getElementById('timerProgress');
  prog.style.strokeDashoffset = '0';
  prog.classList.remove('warn', 'danger');

  timerInterval = setInterval(() => {
    const elapsed = (Date.now() - timerStartTime) / 1000;
    const pct = Math.min(elapsed / TIMER_DURATION, 1);
    prog.style.strokeDashoffset = (pct * TIMER_CIRCUMFERENCE).toString();

    if (pct > 0.7) prog.classList.add('danger');
    else if (pct > 0.5) prog.classList.add('warn');

    if (pct >= 1) {
      stopTimer();
      // Timer ran out — no penalty, just no speed bonus possible
    }
  }, 50);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function getElapsedTime() {
  return (Date.now() - timerStartTime) / 1000;
}

/* ══════════════════════════════════════════════
   LOAD WORD
══════════════════════════════════════════════ */
function loadWord() {
  answered = false;
  const w = gameWords[gameIdx];
  currentWord = w;

  // Progress
  const totalWords = gameWords.length;
  const pct = (gameIdx / totalWords) * 100;
  document.getElementById('progFill').style.width = pct + '%';

  // Show subtitle
  const subtitle = document.getElementById('gameSubtitle');
  if (isRetryRound) {
    subtitle.textContent = '🔄 Tekrar turu! Yanlışları öğrenelim!';
  } else {
    subtitle.textContent = 'Dinle → Doğru resmi seç!';
  }

  // Show English word
  document.getElementById('wordDisplay').textContent = w.en.toUpperCase();

  // Choices: correct + 2 random distractors from the same category
  const distractorPool = (currentCatKey === 'random') 
    ? Object.values(CATEGORIES).flatMap(c => c.words)
    : currentCatInfo.words;
  const pool = shuffle(distractorPool.filter(x => x.emoji !== w.emoji));
  const choices = shuffle([w, pool[0], pool[1]]);

  const grid = document.getElementById('choicesGrid');
  grid.innerHTML = '';
  choices.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    const isCorrect = ch.en === w.en;
    btn.innerHTML = `
      <span class="choice-emoji">${ch.emoji}</span>
      <span class="choice-tr">${ch.tr}</span>`;
    btn.dataset.correct = isCorrect ? '1' : '0';
    btn.addEventListener('click', () => handlePick(btn, isCorrect, w));
    grid.appendChild(btn);
  });

  // Start timer
  startTimer();

  // Hide speed bonus
  document.getElementById('speedBonus').classList.remove('show');

  // Auto-speak
  setTimeout(() => speakWord(w.en), 500);
}

/* ══════════════════════════════════════════════
   HANDLE PICK
══════════════════════════════════════════════ */
function handlePick(btn, isCorrect, word) {
  if (answered) return;
  answered = true;
  stopTimer();

  const elapsed = getElapsedTime();
  const speedBonus = (isCorrect && elapsed < 3) ? 5 : 0;

  // Disable all
  document.querySelectorAll('.choice-btn').forEach(b => {
    if (b !== btn) b.classList.add('dimmed');
  });

  if (isCorrect) {
    btn.classList.add('correct');
    correctCount++;
    streak++;
    if (streak > bestStreak) bestStreak = streak;
    stars = Math.min(5, stars + 1);

    // Score calculation
    let pts = 10;
    let streakBonus = 0;
    if (streak >= 5) streakBonus = 10;
    else if (streak >= 3) streakBonus = 5;
    pts += streakBonus + speedBonus;
    score += pts;

    updateStars(stars);
    updateStreak(streak);
    document.getElementById('scoreVal').textContent = score;

    // Speed bonus indicator
    if (speedBonus > 0) {
      const sb = document.getElementById('speedBonus');
      sb.classList.add('show');
      setTimeout(() => sb.classList.remove('show'), 1500);
    }

    playCorrect();
    spawnConfetti(btn);

    // Big confetti for 5+ streak
    if (streak >= 5) {
      for (let i = 0; i < 3; i++) setTimeout(() => spawnConfettiBurst(), i * 150);
    }

    setTimeout(() => speakWord(word.en), 300);
    setTimeout(() => showFB(true, word, pts, streakBonus, speedBonus), 900);
  } else {
    btn.classList.add('wrong');
    // Add to wrong words for retry
    if (!wrongWords.find(w => w.en === word.en)) {
      wrongWords.push(word);
    }
    // Reveal correct
    document.querySelectorAll('.choice-btn').forEach(b => {
      if (b.dataset.correct === '1') {
        b.classList.remove('dimmed');
        b.classList.add('correct');
      }
    });
    streak = 0;
    stars = Math.max(0, stars - 1);
    updateStars(stars);
    updateStreak(0);
    playWrong();
    setTimeout(() => speakWord(word.en), 400);
    setTimeout(() => showFB(false, word, 0, 0, 0), 1000);
  }
}

/* ══════════════════════════════════════════════
   STREAK
══════════════════════════════════════════════ */
function updateStreak(count) {
  document.getElementById('streakVal').textContent = count;
  const pill = document.getElementById('streakPill');
  if (count >= 3) pill.classList.add('active');
  else pill.classList.remove('active');
}

/* ══════════════════════════════════════════════
   STARS
══════════════════════════════════════════════ */
function updateStars(count) {
  for (let i = 0; i < 5; i++) {
    const s = document.getElementById('s' + i);
    s.textContent = i < count ? '⭐' : '☆';
    if (i < count) s.classList.add('lit');
    else s.classList.remove('lit');
  }
}

/* ══════════════════════════════════════════════
   FEEDBACK
══════════════════════════════════════════════ */
function showFB(ok, word, pts, streakBonus, speedBonus) {
  document.getElementById('fbBigEmoji').textContent = word.emoji;
  document.getElementById('fbWordEn').textContent = word.en.toUpperCase();
  document.getElementById('fbWordTr').textContent = '🇹🇷 ' + word.tr;

  const titles = {
    ok: ['Harika! 🎉','Doğru! ⭐','Süpersin! 🌟','Süper! 🏆','Aferin! 💫'],
    bad:['Neredeyse! 💪','Tekrar dene! 🔄','Şaşırtıcı değil mi? 🤔','Tamam, öğrendik! 📚']
  };
  document.getElementById('fbTitle').textContent = ok
    ? titles.ok[0|Math.random()*titles.ok.length]
    : titles.bad[0|Math.random()*titles.bad.length];
  document.getElementById('fbTitle').className = 'fb-title ' + (ok ? 'ok' : 'bad');

  // Streak bonus display
  const fbStreak = document.getElementById('fbStreakBonus');
  if (ok && streakBonus > 0) {
    fbStreak.textContent = `🔥 Seri Bonus: +${streakBonus}!` + (speedBonus > 0 ? ` ⚡ Hız: +${speedBonus}!` : '');
    fbStreak.classList.add('show');
  } else if (ok && speedBonus > 0) {
    fbStreak.textContent = `⚡ Hız Bonusu: +${speedBonus}!`;
    fbStreak.classList.add('show');
  } else {
    fbStreak.classList.remove('show');
  }

  document.getElementById('fbPts').textContent = ok
    ? `+${pts} puan 🎯 Toplam: ${score}`
    : `Bu kelime: ${word.en} = ${word.tr}`;

  const nextBtn = document.getElementById('fbNextBtn');
  if (gameIdx >= gameWords.length - 1) {
    // Check if there are wrong words to retry
    if (!isRetryRound && wrongWords.length > 0) {
      nextBtn.textContent = '🔄 Yanlışları Tekrar Dene!';
    } else {
      nextBtn.textContent = '🏆 Sonuçları Gör!';
    }
  } else {
    nextBtn.textContent = 'Sıradaki kelime →';
  }

  document.getElementById('fbOverlay').classList.add('show');
}

function nextWord() {
  document.getElementById('fbOverlay').classList.remove('show');
  gameIdx++;
  if (gameIdx >= gameWords.length) {
    // Check for retry round
    if (!isRetryRound && wrongWords.length > 0) {
      // Start retry round
      isRetryRound = true;
      gameWords = shuffle([...wrongWords]);
      wrongWords = [];
      gameIdx = 0;
      loadWord();
    } else {
      showWin();
    }
  } else {
    loadWord();
  }
}

/* ══════════════════════════════════════════════
   WIN SCREEN
══════════════════════════════════════════════ */
function showWin() {
  stopTimer();
  document.getElementById('progFill').style.width = '100%';
  document.getElementById('wSc').textContent = score;
  document.getElementById('wCo').textContent = correctCount + '/' + (gameWords.length + (isRetryRound ? 0 : wrongWords.length));
  document.getElementById('wSr').textContent = stars;
  document.getElementById('wBs').textContent = bestStreak;

  // Learned words
  const allPlayed = isRetryRound
    ? [...new Set([...gameWords])]
    : gameWords;
  const learnedEmojis = allPlayed.map(w => w.emoji).join(' ');
  document.getElementById('winLearned').textContent = 'Öğrendiklerin: ' + learnedEmojis;

  // Save best score
  if (currentCatKey) saveBestScore(currentCatKey, score);

  document.getElementById('winScreen').classList.add('show');
  fireworksRunning = true; startFireworks(); playWinJingle();
}

function replayCurrent() {
  document.getElementById('winScreen').classList.remove('show');
  fireworksRunning = false; fwParts = [];
  if (currentCatKey === 'random') startRandom();
  else if (currentCatKey && CATEGORIES[currentCatKey]) startCategory(currentCatKey);
}

function goMenu() {
  document.getElementById('winScreen').classList.remove('show');
  fireworksRunning = false; fwParts = [];
  stopTimer();
  synth.cancel();
  document.getElementById('gameScreen').style.display = 'none';
  document.getElementById('catScreen').style.display = 'block';
  buildCatScreen(); // Refresh to show new best scores
}

/* ══════════════════════════════════════════════
   CONFETTI SYSTEM
══════════════════════════════════════════════ */
const confettiCanvas = document.getElementById('confettiCanvas');
const confettiCtx = confettiCanvas.getContext('2d');
let confettiParts = [];
let confettiRunning = false;

function resizeConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
resizeConfetti();

const CONFETTI_COLORS = ['#3b82f6','#a855f7','#22c55e','#f97316','#f43f5e','#fbbf24','#06b6d4','#ec4899'];

function spawnConfetti(targetBtn) {
  const rect = targetBtn.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;

  for (let i = 0; i < 30; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 6;
    confettiParts.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 3,
      color: CONFETTI_COLORS[0|Math.random()*CONFETTI_COLORS.length],
      size: 3 + Math.random() * 5,
      alpha: 1,
      decay: 0.015 + Math.random() * 0.01,
      gravity: 0.12,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      shape: Math.random() > 0.5 ? 'rect' : 'circle'
    });
  }
  if (!confettiRunning) { confettiRunning = true; animateConfetti(); }
}

function spawnConfettiBurst() {
  const cx = Math.random() * confettiCanvas.width;
  const cy = confettiCanvas.height * 0.3 + Math.random() * confettiCanvas.height * 0.3;

  for (let i = 0; i < 50; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 3 + Math.random() * 8;
    confettiParts.push({
      x: cx, y: cy,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 4,
      color: CONFETTI_COLORS[0|Math.random()*CONFETTI_COLORS.length],
      size: 4 + Math.random() * 6,
      alpha: 1,
      decay: 0.01 + Math.random() * 0.008,
      gravity: 0.1,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 12,
      shape: ['rect','circle','star'][0|Math.random()*3]
    });
  }
  if (!confettiRunning) { confettiRunning = true; animateConfetti(); }
}

function animateConfetti() {
  confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  confettiParts = confettiParts.filter(p => p.alpha > 0.01);

  if (confettiParts.length === 0) { confettiRunning = false; return; }

  confettiParts.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.vx *= 0.99;
    p.alpha -= p.decay;
    p.rotation += p.rotSpeed;

    confettiCtx.save();
    confettiCtx.globalAlpha = p.alpha;
    confettiCtx.translate(p.x, p.y);
    confettiCtx.rotate(p.rotation * Math.PI / 180);
    confettiCtx.fillStyle = p.color;

    if (p.shape === 'rect') {
      confettiCtx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
    } else if (p.shape === 'star') {
      drawStar(confettiCtx, 0, 0, 5, p.size/2, p.size/4);
    } else {
      confettiCtx.beginPath();
      confettiCtx.arc(0, 0, p.size/2, 0, Math.PI*2);
      confettiCtx.fill();
    }
    confettiCtx.restore();
  });

  requestAnimationFrame(animateConfetti);
}

function drawStar(ctx, cx, cy, spikes, outerR, innerR) {
  let rot = Math.PI / 2 * 3;
  const step = Math.PI / spikes;
  ctx.beginPath();
  ctx.moveTo(cx, cy - outerR);
  for (let i = 0; i < spikes; i++) {
    ctx.lineTo(cx + Math.cos(rot) * outerR, cy + Math.sin(rot) * outerR);
    rot += step;
    ctx.lineTo(cx + Math.cos(rot) * innerR, cy + Math.sin(rot) * innerR);
    rot += step;
  }
  ctx.lineTo(cx, cy - outerR);
  ctx.closePath();
  ctx.fill();
}

/* ══════════════════════════════════════════════
   AUDIO
══════════════════════════════════════════════ */
let audioCtx = null;
function getAC() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function tone(f, t, dur, vol=0.2, t0=0) {
  const c = getAC(), o = c.createOscillator(), g = c.createGain();
  o.connect(g); g.connect(c.destination); o.type = t; o.frequency.value = f;
  g.gain.setValueAtTime(vol, c.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + t0 + dur);
  o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .05);
}
function playCorrect() { tone(523,'sine',.1,.2,0); tone(659,'sine',.1,.2,.1); tone(784,'sine',.22,.22,.2); }
function playWrong()   { tone(300,'sawtooth',.1,.14,0); tone(220,'sawtooth',.18,.14,.1); }
function playWinJingle() {
  [[523,0],[659,.15],[784,.3],[880,.48],[1047,.66],[784,.85],[1047,1.05],[1175,1.25],[1397,1.5]]
    .forEach(([f,s]) => tone(f,'sine',.3,.2,s));
}

/* ══════════════════════════════════════════════
   FIREWORKS
══════════════════════════════════════════════ */
const fwCanvas = document.getElementById('fw');
const fwCtx = fwCanvas.getContext('2d');
let fwParts = [], fireworksRunning = false, fwTimer;

function resizeFW() { fwCanvas.width = window.innerWidth; fwCanvas.height = window.innerHeight; }
resizeFW();

function spawnFW() {
  const x = Math.random() * fwCanvas.width, y = 20 + Math.random() * fwCanvas.height * .5;
  const cols = ['#3b82f6','#a855f7','#22c55e','#f97316','#f43f5e','#fbbf24','#06b6d4'];
  const col = cols[0|Math.random()*cols.length];
  for (let i = 0; i < 55; i++) {
    const a = Math.PI*2/55*i + Math.random()*.2, s = 2 + Math.random()*5;
    fwParts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1,alpha:1,color:col,size:1.5+Math.random()*2.5,decay:.013+Math.random()*.01,gravity:.065});
  }
}

function animateFW() {
  if (!fireworksRunning) { fwCtx.clearRect(0,0,fwCanvas.width,fwCanvas.height); return; }
  const trailColor = getComputedStyle(document.documentElement).getPropertyValue('--fw-trail').trim() || 'rgba(232,244,255,.12)';
  fwCtx.fillStyle = trailColor;
  fwCtx.fillRect(0,0,fwCanvas.width,fwCanvas.height);
  fwParts = fwParts.filter(p => p.alpha > .01);
  fwParts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += p.gravity; p.vx *= .985; p.alpha -= p.decay;
    fwCtx.save(); fwCtx.globalAlpha = p.alpha; fwCtx.fillStyle = p.color;
    fwCtx.beginPath(); fwCtx.arc(p.x, p.y, p.size, 0, Math.PI*2); fwCtx.fill(); fwCtx.restore();
  });
  requestAnimationFrame(animateFW);
}

function startFireworks() {
  fwParts = []; animateFW();
  fwTimer = setInterval(() => {
    if (!fireworksRunning) { clearInterval(fwTimer); return; }
    spawnFW(); if (Math.random() < .4) spawnFW();
  }, 400);
}

══════════════════════════════════════════════ */
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installWrap').classList.add('show');
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('installWrap').classList.remove('show');
});

function installApp() {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  deferredPrompt.userChoice.then((result) => {
    if (result.outcome === 'accepted') {
      document.getElementById('installWrap').classList.remove('show');
    }
    deferredPrompt = null;
  });
}

// Check if already installed (standalone mode)
if (window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone) {
  // Already installed, don't show button
} else {
  // Button visibility is controlled by beforeinstallprompt event
}

buildCatScreen();
initPWA();
