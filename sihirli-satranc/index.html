<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Klasik Satranç</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <!-- Satranç Tahtası (Ekranı Maksimum Kaplar) -->
    <div class="board-wrapper">
      <div id="chess-board" class="chess-board"></div>
    </div>

    <!-- Sade Kontrol Paneli -->
    <div class="control-panel">
      <!-- Durum -->
      <div class="status-box">
        <div id="status-title" class="status-title">Klasik Satranç</div>
        <div id="status-turn" class="status-turn">Beyazın Sırası</div>
      </div>

      <!-- Mod & Seviye Seçimi -->
      <div class="select-row">
        <label for="select-game-mode" class="select-label">OYUN MODU / SEVİYE</label>
        <select id="select-game-mode" class="classic-select">
          <option value="bot_1">🤖 Bilgisayar (Seviye 1 - Acemi)</option>
          <option value="bot_2">🤖 Bilgisayar (Seviye 2 - Kolay)</option>
          <option value="bot_3">🤖 Bilgisayar (Seviye 3 - Orta)</option>
          <option value="bot_4">🤖 Bilgisayar (Seviye 4 - Zor)</option>
          <option value="bot_5">🤖 Bilgisayar (Seviye 5 - Usta)</option>
          <option value="pvp">👥 Karşılıklı (İki Kişilik)</option>
        </select>
      </div>

      <!-- Kontrol Butonları -->
      <div class="btn-group">
        <button id="btn-undo" class="classic-btn">↩️ Geri Al</button>
        <button id="btn-restart" class="classic-btn primary">🔄 Yeni Oyun</button>
        <button id="btn-flip" class="classic-btn">🔁 Çevir</button>
        <a id="link-apk-download" href="SihirliSatranc.apk" download="SihirliSatranc.apk" style="text-decoration: none;">
          <button class="classic-btn" style="background: #2980b9; border-color: #3498db; width: 100%;">📥 APK İndir</button>
        </a>
      </div>
    </div>
  </div>

  <!-- Terfi (Promotion) Modalı -->
  <div id="modal-promotion" class="modal-overlay">
    <div class="modal-card">
      <div class="modal-title">Piyon Terfisi</div>
      <div class="promo-choices">
        <button class="promo-square-btn" data-promo="Q" title="Vezir" id="promo-q"></button>
        <button class="promo-square-btn" data-promo="R" title="Kale" id="promo-r"></button>
        <button class="promo-square-btn" data-promo="B" title="Fil" id="promo-b"></button>
        <button class="promo-square-btn" data-promo="N" title="At" id="promo-n"></button>
      </div>
    </div>
  </div>

  <script src="pieces.js"></script>
  <script src="audio.js"></script>
  <script src="chess_engine.js"></script>
  <script src="app.js"></script>

  <script>
    // Terfi kutusundaki Staunton simgelerini yükle
    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('promo-q').innerHTML = StauntonPieces.wQ;
      document.getElementById('promo-r').innerHTML = StauntonPieces.wR;
      document.getElementById('promo-b').innerHTML = StauntonPieces.wB;
      document.getElementById('promo-n').innerHTML = StauntonPieces.wN;

      // Android WebView içindeyse doğrudan APK indir butonunu gizle
      if (window.location.protocol === 'file:') {
        const apkBtn = document.getElementById('link-apk-download');
        if (apkBtn) apkBtn.style.display = 'none';
      }
    });
  </script>
</body>
</html>
