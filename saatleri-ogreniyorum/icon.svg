<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9F43"/>
      <stop offset="100%" stop-color="#FF5252"/>
    </linearGradient>
    <linearGradient id="clockGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF5E6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  
  <!-- Clock Outer Rim -->
  <circle cx="256" cy="256" r="200" fill="#FFEAA7" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="180" fill="url(#clockGrad)"/>
  <circle cx="256" cy="256" r="175" fill="none" stroke="#FFD271" stroke-width="6"/>

  <!-- Hours ticks & numbers -->
  <circle cx="256" cy="100" r="12" fill="#FF7675"/>
  <circle cx="412" cy="256" r="12" fill="#74B9FF"/>
  <circle cx="256" cy="412" r="12" fill="#55E6C1"/>
  <circle cx="100" cy="256" r="12" fill="#F8C291"/>

  <!-- Happy Face Center -->
  <circle cx="216" cy="210" r="12" fill="#2D3436"/>
  <circle cx="296" cy="210" r="12" fill="#2D3436"/>
  <circle cx="220" cy="206" r="4" fill="#FFFFFF"/>
  <circle cx="300" cy="206" r="4" fill="#FFFFFF"/>
  <!-- Blush -->
  <ellipse cx="196" cy="230" rx="14" ry="8" fill="#FF8A80" opacity="0.6"/>
  <ellipse cx="316" cy="230" rx="14" ry="8" fill="#FF8A80" opacity="0.6"/>
  <!-- Smile -->
  <path d="M 226 240 Q 256 270 286 240" fill="none" stroke="#2D3436" stroke-width="8" stroke-linecap="round"/>

  <!-- Hour Hand (Short, Pink) -->
  <line x1="256" y1="256" x2="256" y2="145" stroke="#E84393" stroke-width="18" stroke-linecap="round"/>
  
  <!-- Minute Hand (Long, Cyan) -->
  <line x1="256" y1="256" x2="365" y2="256" stroke="#0984E3" stroke-width="14" stroke-linecap="round"/>

  <!-- Center Pin -->
  <circle cx="256" cy="256" r="18" fill="#FDCB6E"/>
  <circle cx="256" cy="256" r="8" fill="#2D3436"/>
</svg>
